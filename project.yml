name: WakeAtStation
options:
  bundleIdPrefix: com.tomo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WakeAtStation:
    type: application
    platform: iOS
    sources:
      - path: ios/WakeAtStation
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: ios/WakeAtStation/Resources/stations.json
      - path: ios/WakeAtStation/Resources/Assets.xcassets
    info:
      path: ios/WakeAtStation/Resources/Info.plist
    entitlements:
      path: ios/WakeAtStation/WakeAtStation.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.wakeatstation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: WakeAtStationWatch

  WakeAtStationWatch:
    type: application
    platform: watchOS
    sources:
      - path: ios/WakeAtStationWatch
        excludes:
          - "Resources/Info.plist"
      - path: ios/Shared/SharedState.swift
    resources:
      - path: ios/WakeAtStationWatch/Resources/Assets.xcassets
    info:
      path: ios/WakeAtStationWatch/Resources/Info.plist
    entitlements:
      path: ios/WakeAtStationWatch/WakeAtStationWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.wakeatstation.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: WakeAtStationComplication
        embed: true

  WakeAtStationComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: ios/WakeAtStationComplication
        excludes:
          - "Info.plist"
      - path: ios/Shared/SharedState.swift
    info:
      path: ios/WakeAtStationComplication/Info.plist
    entitlements:
      path: ios/WakeAtStationComplication/WakeAtStationComplication.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.wakeatstation.watchkitapp.complication
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES

  WakeAtStationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/WakeAtStationTests
    dependencies:
      - target: WakeAtStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.wakeatstation.tests
        GENERATE_INFOPLIST_FILE: YES
