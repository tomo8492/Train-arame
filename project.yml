name: WorkoutKit
options:
  bundleIdPrefix: com.tomo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ja

configs:
  Debug: debug
  Beta: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    APP_INTENTS_DEPLOYMENT_POSTPROCESSING: NO
  configs:
    Debug:
      xcconfig: Config/Debug.xcconfig
    Beta:
      xcconfig: Config/Beta.xcconfig
    Release:
      xcconfig: Config/Release.xcconfig

targets:
  WorkoutKit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutKit
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: WorkoutKit/Resources/exercises_seed.json
      - path: WorkoutKit/Resources/PrivacyInfo.xcprivacy
      - path: WorkoutKit/Resources/Assets.xcassets
      - path: WorkoutKit/Resources/Localizable.xcstrings
    info:
      path: WorkoutKit/Resources/Info.plist
      properties:
        CFBundleDisplayName: WorkoutKit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
    entitlements:
      path: WorkoutKit/WorkoutKit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tomo.workoutkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.workoutkit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: []

  WorkoutKitLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkoutKitLiveActivity
        excludes:
          - "Info.plist"
          - "WorkoutKitLiveActivity.entitlements"
    info:
      path: WorkoutKitLiveActivity/Info.plist
    entitlements:
      path: WorkoutKitLiveActivity/WorkoutKitLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tomo.workoutkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.workoutkit.liveactivity
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: WorkoutKitLiveActivity/Info.plist

  WorkoutKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/WorkoutKitTests
    dependencies:
      - target: WorkoutKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.workoutkit.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
